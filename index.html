    <div class="calculatrice">

        <h2>Calculatrice</h2>

        <input type="number" id="num1" placeholder="Nombre 1">

        <div class="buttons">

            <button onclick="Soustraction()" id="moins">-</button>

        </div>
        
        
        <button onclick="Calculer()" id="egal">=</button>
        <button onclick="Effacer()"  id="effacer">Effacer</button>

        <h3 id="resultat">Résultat :</h3>

    </div>
